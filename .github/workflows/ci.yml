name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3030
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Node.js runtime
        run: npm run check:node

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Execute database migrations and integrity tests
        run: npm run test:db

      - name: Build production application
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Public browser checks
        run: npm run test:e2e

  staging:
    name: Deploy and verify staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
